[project]
name = "akunaki"
version = "0.1.0"
description = "Akunaki backend core: FastAPI + SQLAlchemy/libSQL + Alembic (model-free foundation)"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "sqlalchemy-libsql==0.2.0",
    "cryptography==50.0.0",
    # httpx2 is the legitimate Pydantic-published next-generation httpx fork
    # (author Tom Christie, homepage github.com/pydantic/httpx2), not a typosquat
    # of `httpx`. It backs every outbound provider HTTP call.
    "httpx2==2.10.0",
    "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==2.3.0",
    "import-linter==2.13",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "akunaki"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Coverage is not in addopts: it slows every local run. CI passes --cov
# explicitly (see the quality job), which is what backs the "Tested" column
# in docs/implementation-status.md.
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/akunaki"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Type-checking-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Protocol/ABC method bodies in the ports layer are declarations only.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit subset
    "T20",  # no print (allow in __main__ via per-file)
    "N",    # pep8-naming
    "C4",   # comprehensions
    "PTH",  # pathlib
]
ignore = [
    "S101",  # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/akunaki/api/__main__.py" = ["T20"]
"src/akunaki/worker/__main__.py" = ["T20"]
# Local dev utilities, not shipped in the package: printing to the terminal is
# their whole interface, and they intentionally import inside functions.
"scripts/**" = ["T20", "PLC0415"]
# Migration scripts are generated-shaped and frozen once applied: they are
# rewritten only by a new revision, never reformatted in place. E501 spares the
# long generated CheckConstraint lines; S608 covers the interpolation of
# module-level *code constants* (never user input) into one-off DDL/DML.
"src/akunaki/migrations/versions/**" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["akunaki"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# An applied migration is a historical record: reformatting one rewrites a file
# that has already run against real databases, for no behavioural gain. New
# revisions are written formatted; old ones are left exactly as applied.
exclude = ["src/akunaki/migrations/versions/**"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = ["src", "tests"]
files = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_packages = ["akunaki"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["akunaki.domain"]
forbidden_modules = [
    "akunaki.adapters",
    "akunaki.api",
    "akunaki.worker",
    "akunaki.application",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "httpx",
    "httpx2",
]

[[tool.importlinter.contracts]]
name = "Application depends only on domain and ports"
type = "forbidden"
source_modules = ["akunaki.application"]
forbidden_modules = [
    "akunaki.adapters",
    "akunaki.api",
    "akunaki.worker",
    "fastapi",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Ports depend only on domain"
type = "forbidden"
source_modules = ["akunaki.ports"]
forbidden_modules = [
    "akunaki.adapters",
    "akunaki.api",
    "akunaki.worker",
    "akunaki.application",
    "sqlalchemy",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "Adapters do not import api or worker internals"
type = "forbidden"
source_modules = ["akunaki.adapters"]
forbidden_modules = [
    "akunaki.api",
    "akunaki.worker",
]

[[tool.importlinter.contracts]]
name = "No model SDKs in core package"
type = "forbidden"
source_modules = ["akunaki"]
# Top-level package names only (import-linter rejects external subpackages).
forbidden_modules = [
    "openai",
    "anthropic",
    "xai",
    "xai_sdk",
    "openrouter",
    "litellm",
    "ollama",
    "llama_cpp",
    "transformers",
    "torch",
]
